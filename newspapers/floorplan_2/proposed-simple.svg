<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" width="800" height="1600" role="img" aria-labelledby="title desc">
  <title id="title">Proposed second-floor plan</title>
  <desc id="desc">Proposed plan with two bedrooms, two en-suites, storage passage, plant room, mini kitchen, landing, study, windows, doors and staircase.</desc>
  <defs>
    <style>
      .outer{fill:none;stroke:#111;stroke-width:18;stroke-linejoin:miter}
      .wall{fill:none;stroke:#111;stroke-width:12;stroke-linecap:square;stroke-linejoin:miter}
      .window{fill:#fff;stroke:#718b9b;stroke-width:3}
      .pane{fill:none;stroke:#9aabb5;stroke-width:2}
      .door,.arc{fill:none;stroke:#66747c;stroke-width:3}
      .slider{fill:none;stroke:#718b9b;stroke-width:3}
      .stair{fill:none;stroke:#20272b;stroke-width:4}
      .tread{fill:none;stroke:#7c878d;stroke-width:2}
      .label{fill:#c62828;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;text-anchor:middle;letter-spacing:1px}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#20272b"/>
    </marker>
  </defs>

  <!-- Footprint and primary partitions trace the supplied 800 × 1600 reference. -->
  <path class="outer" d="M110 40 L720 250 L720 825 L780 825 L780 1545 L205 1545 L110 1460 Z"/>

  <g class="wall">
    <!-- Left-hand rooms and central landing spine. -->
    <path d="M110 419 H285 M345 419 H445"/>
    <path d="M445 159 V419 M445 419 V485 M445 545 V835 M445 895 V1095"/>
    <path d="M110 755 H445"/>
    <path d="M110 1095 H199 M259 1095 H365 M425 1095 H445"/>

    <!-- Plant room, mini kitchen and landing/stair enclosure. -->
    <path d="M445 419 H606"/>
    <path d="M606 218 V359 M606 419 V520 M606 700 V720 H720"/>
    <path d="M720 720 V825"/>

    <!-- Study, bottom en-suite, and shortened storage cupboard/passage. -->
    <path d="M350 1095 H495 M555 1095 H780"/>
    <path d="M350 1095 V1445"/>
    <path d="M350 1445 H445"/>
    <path d="M445 1095 V1385 M445 1445 V1545"/>
  </g>

  <g id="doors">
    <!-- Top en-suite door. -->
    <path class="door" d="M345 419 V359"/>
    <path class="arc" d="M285 419 A60 60 0 0 1 345 359"/>

    <!-- Bedroom 1: one door, opening to landing. -->
    <path class="door" d="M445 485 H505"/>
    <path class="arc" d="M445 545 A60 60 0 0 1 505 485"/>

    <!-- Bedroom 2: landing door. -->
    <path class="door" d="M445 835 H505"/>
    <path class="arc" d="M445 895 A60 60 0 0 1 505 835"/>

    <!-- Bedroom 2: top entrance to storage passage. -->
    <path class="door" d="M365 1095 V1035"/>
    <path class="arc" d="M425 1095 A60 60 0 0 0 365 1035"/>

    <!-- Bedroom 2: bottom en-suite door. -->
    <path class="door" d="M199 1095 V1155"/>
    <path class="arc" d="M259 1095 A60 60 0 0 1 199 1155"/>

    <!-- Plant room opens outward into mini kitchen only. -->
    <path class="door" d="M606 359 H666"/>
    <path class="arc" d="M606 419 A60 60 0 0 0 666 359"/>

    <!-- Storage passage door into study. -->
    <path class="door" d="M445 1385 H505"/>
    <path class="arc" d="M445 1445 A60 60 0 0 1 505 1385"/>

    <!-- Study door from landing. -->
    <path class="door" d="M495 1095 V1035"/>
    <path class="arc" d="M555 1095 A60 60 0 0 0 495 1035"/>

    <!-- Glass sliding door between mini kitchen and landing. -->
    <g aria-label="Glass sliding door between mini kitchen and landing">
      <path class="slider" d="M606 520 V700 M616 520 V700"/>
      <path class="slider" d="M610 530 V690 M610 530 L602 540 M610 690 L618 680"/>
    </g>
  </g>

  <g id="windows">
    <g class="window">
      <rect x="98" y="155" width="24" height="105"/>
      <rect x="98" y="470" width="24" height="105"/>
      <rect x="98" y="820" width="24" height="105"/>
      <rect x="98" y="1210" width="24" height="105"/>
      <rect x="708" y="314" width="24" height="176"/>
      <rect x="708" y="523" width="24" height="176"/>
      <rect x="350" y="1533" width="190" height="24"/>
    </g>
    <g class="pane">
      <path d="M104 155 V260 M116 155 V260 M104 470 V575 M116 470 V575 M104 820 V925 M116 820 V925 M104 1210 V1315 M116 1210 V1315"/>
      <path d="M714 314 V490 M726 314 V490 M714 523 V699 M726 523 V699"/>
      <path d="M350 1539 H540 M350 1551 H540"/>
    </g>
  </g>

  <g id="stairs">
    <rect class="stair" x="620" y="725" width="95" height="245"/>
    <g class="tread">
      <path d="M620 750 H715 M620 775 H715 M620 800 H715 M620 825 H715 M620 850 H715 M620 875 H715 M620 900 H715 M620 925 H715 M620 950 H715"/>
    </g>
    <path class="stair" d="M668 945 V865" marker-end="url(#arrow)"/>
  </g>

  <g class="label" id="room-labels">
    <text x="270" y="275">EN-SUITE</text>
    <text x="275" y="595">BEDROOM 1</text>
    <text x="275" y="930">BEDROOM 2</text>
    <text x="220" y="1365">EN-SUITE</text>
    <text x="-1280" y="410" font-size="17" transform="rotate(-90)">STORAGE</text>
    <text x="525" y="290"><tspan x="525">PLANT</tspan><tspan x="525" dy="24">ROOM</tspan></text>
    <text x="665" y="575"><tspan x="665">MINI</tspan><tspan x="665" dy="24">KITCHEN</tspan></text>
    <text x="535" y="930">LANDING</text>
    <text x="610" y="1360">STUDY</text>
  </g>
</svg>
