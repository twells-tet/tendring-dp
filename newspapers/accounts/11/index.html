<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Accounts 2026/27 | ACCOUNTING</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .accounts-data-table { width: 100%; border-collapse: collapse; margin-top: 1.25rem; }
        .accounts-data-table th, .accounts-data-table td { padding: 0.65rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border-strong, #333); }
        .accounts-data-table th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .accounts-data-table .amount { text-align: right; }
        .accounts-status { margin: 1rem 0 0; }
        .transaction-count { margin: 0.4rem 0 0; font-size: 0.8rem; text-align: right; color: #555; }
    </style>
</head>
<body class="tarian-homepage pin-locked">
    <div id="pin-gate" class="pin-gate">
        <div class="pin-gate-box">
            <img src="../../tarian-shield.svg" alt="" class="pin-gate-logo">
            <h2>TARIAN</h2>
            <p>Enter the 6-digit PIN to continue.</p>
            <form id="pin-gate-form" autocomplete="off">
                <input type="password" id="pin-gate-input" class="pin-gate-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="6-digit PIN">
                <button type="submit" class="pin-gate-button">Unlock</button>
            </form>
            <p id="pin-gate-error" class="pin-gate-error" hidden>Incorrect PIN. Please try again.</p>
        </div>
    </div>
    <header class="page-header tarian-homepage-header" id="top">
        <a href="/beta/" class="page-header-logo-link" aria-label="Tarian home">
            <img src="../../tarian-shield.svg" alt="" class="page-header-logo">
        </a>
    </header>
    <main class="app-shell">
        <div class="tarian-homepage-card">
            <p><a href="../">&larr; Back to accounts</a></p>
            <p class="eyebrow">ACCOUNTING</p>
            <p class="subheading">Personal Accounts 2026/27</p>
            <table class="accounts-data-table"><tbody>
                <tr><th>Total In</th><td id="total-in" class="amount">0.00</td></tr>
                <tr><th>Total Out</th><td id="total-out" class="amount">-0.00</td></tr>
                <tr><th>Profit / Loss</th><td id="profit-loss" class="amount">0.00</td></tr>
            </tbody></table>
            <p id="transaction-count" class="transaction-count">0 transactions</p>
            <p id="accounts-status" class="accounts-status">Loading accounts...</p>
            <table id="accounts-data-table" class="accounts-data-table" hidden>
                <thead><tr><th>Date</th><th>Description</th><th>Direction</th><th class="amount">Amount</th></tr></thead>
                <tbody id="accounts-data-body"></tbody>
            </table>
        </div>
    </main>
    <script src="../accounts-table.js"></script>
    <script>initAccountsPage("L:O");</script>
</body>
</html>
