<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floorplan | Tarian Newspapers</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .floorplan-wrap {
            width: 100%;
            padding: clamp(1rem, 3vw, 2.5rem);
            box-sizing: border-box;
        }

        .floorplan-card {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(0.75rem, 2vw, 1.5rem);
            background: #fff;
            border: 1px solid var(--border-strong, #333);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .floorplan-svg {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body class="tarian-homepage">

    <header class="page-header tarian-homepage-header" id="top">
        <a href="../index.html" class="page-header-logo-link" aria-label="Tarian Newspapers home">
            <img src="../tarian-shield.svg" alt="" class="page-header-logo">
        </a>
    </header>

    <main class="app-shell">
        <div class="floorplan-wrap">
            <div class="floorplan-card">

                <svg
                    class="floorplan-svg"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 1000 920"
                    role="img"
                    aria-labelledby="proposed-plan-title proposed-plan-desc"
                >
                    <title id="proposed-plan-title">
                        Proposed redevelopment floorplan
                    </title>

                    <desc id="proposed-plan-desc">
                        Approximate proposed floorplan showing two bedrooms, lounge,
                        hallway, master bedroom with en suite, bathroom, utility room,
                        open kitchen diner, staircase, mezzanine, porch, bifold doors,
                        paving, French drain, stone garden steps and raised lawn.
                    </desc>

                    <defs>
                        <style>
                            .sheet { fill: #fff; }
                            .room { fill: #fff; }

                            .wall {
                                fill: none;
                                stroke: #111;
                                stroke-width: 14;
                                stroke-linejoin: miter;
                                stroke-linecap: square;
                            }

                            .partition {
                                fill: none;
                                stroke: #111;
                                stroke-width: 8;
                                stroke-linejoin: miter;
                                stroke-linecap: square;
                            }

                            .opening-mask {
                                fill: #fff;
                                stroke: none;
                            }

                            .glazing {
                                fill: none;
                                stroke: #5b7f8d;
                                stroke-width: 5;
                            }

                            .glazing-detail {
                                fill: none;
                                stroke: #5b7f8d;
                                stroke-width: 2;
                            }

                            .mezzanine {
                                fill: rgba(0, 0, 0, 0.025);
                                stroke: #555;
                                stroke-width: 3;
                                stroke-dasharray: 10 8;
                                stroke-linejoin: miter;
                            }

                            .stair-outline {
                                fill: #fff;
                                stroke: #333;
                                stroke-width: 3;
                            }

                            .stair-tread {
                                stroke: #777;
                                stroke-width: 2;
                            }

                            .paving {
                                fill: url(#paving-pattern);
                                stroke: #888;
                                stroke-width: 2;
                            }

                            .french-drain {
                                fill: url(#gravel-pattern);
                                stroke: #777;
                                stroke-width: 1.5;
                            }

                            .grass {
                                fill: #dcead5;
                                stroke: #82927a;
                                stroke-width: 2;
                            }

                            .step {
                                fill: #ddd;
                                stroke: #777;
                                stroke-width: 2;
                            }

                            .boundary {
                                stroke: #555;
                                stroke-width: 4;
                                stroke-dasharray: 12 8;
                            }

                            .title {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 34px;
                                font-weight: 800;
                                letter-spacing: 3px;
                                text-anchor: middle;
                                fill: #111;
                            }

                            .subtitle {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 15px;
                                text-anchor: middle;
                                fill: #555;
                            }

                            .room-name {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 18px;
                                font-weight: 700;
                                text-anchor: middle;
                                fill: #111;
                            }

                            .room-area {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                text-anchor: middle;
                                fill: #444;
                            }

                            .small-label {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 12px;
                                font-weight: 700;
                                text-anchor: middle;
                                fill: #222;
                            }

                            .annotation {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                fill: #333;
                            }

                            .dimension {
                                fill: none;
                                stroke: #555;
                                stroke-width: 1.5;
                            }

                            .dimension-extension {
                                fill: none;
                                stroke: #999;
                                stroke-width: 1;
                            }

                            .dimension-text {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                text-anchor: middle;
                                fill: #333;
                            }

                            .scale-text {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 12px;
                                fill: #333;
                            }

                            .north {
                                fill: #111;
                                stroke: #111;
                                stroke-width: 2;
                            }
                        </style>

                        <pattern
                            id="paving-pattern"
                            width="44"
                            height="32"
                            patternUnits="userSpaceOnUse"
                        >
                            <rect width="44" height="32" fill="#e3e3e3"/>
                            <path
                                d="M0 0H44 M0 16H44 M0 32H44
                                   M14 0V16 M34 0V16
                                   M6 16V32 M26 16V32"
                                fill="none"
                                stroke="#c3c3c3"
                                stroke-width="1"
                            />
                        </pattern>

                        <pattern
                            id="gravel-pattern"
                            width="12"
                            height="12"
                            patternUnits="userSpaceOnUse"
                        >
                            <rect width="12" height="12" fill="#eee"/>
                            <circle cx="3" cy="3" r="1" fill="#999"/>
                            <circle cx="9" cy="5" r="1.2" fill="#aaa"/>
                            <circle cx="5" cy="10" r="1" fill="#888"/>
                        </pattern>

                        <marker
                            id="arrow"
                            viewBox="0 0 10 10"
                            refX="5"
                            refY="5"
                            markerWidth="6"
                            markerHeight="6"
                            orient="auto-start-reverse"
                        >
                            <path d="M0 0L10 5L0 10Z" fill="#555"/>
                        </marker>
                    </defs>

                    <rect class="sheet" x="0" y="0" width="1000" height="920"/>

                    <text x="500" y="48" class="title">PROPOSED</text>
                    <text x="500" y="73" class="subtitle">

                    <rect x="410" y="92" width="380" height="42" class="grass"/>

                        <line x1="600" y1="167" x2="790" y2="167" class="dimension"/>
                        <line x1="600" y1="178" x2="790" y2="178" class="dimension"/>

                    <rect x="790" y="360" width="65" height="110" class="room"/>

                    <path

                    <path class="partition" d="M400 560V820"/>
                    <path class="partition" d="M790 360V470"/>

                    <rect x="302" y="397" width="48" height="17" class="opening-mask"/>

                    <g aria-label="Staircase to mezzanine">
                        <rect x="410" y="325" width="55" height="150" class="stair-outline"/>

                        <line x1="410" y1="340" x2="465" y2="340" class="stair-tread"/>

                        <line

                            x2="437"

                            class="dimension"

                        />
                    </g>

                    <path

                        d="
                            M410 325

                            H790

                    />

                    <text x="610" y="194" class="small-label">MEZZANINE ABOVE</text>
                    <text x="610" y="212" class="room-area">
                        Inverted-L study / double-bedroom-size platform
                    </text>
                    <text x="610" y="229" class="room-area">Approx. 13–15 m²</text>

                    <line x1="470" y1="160" x2="585" y2="160" class="glazing"/>
                    <line x1="470" y1="154" x2="585" y2="154" class="glazing-detail"/>
                    <line x1="508" y1="151" x2="508" y2="163" class="glazing-detail"/>

                    <text x="528" y="148" class="annotation" text-anchor="middle">

                    </text>

                    <g aria-label="Bifold doors">
                        <rect x="782" y="220" width="17" height="105" class="opening-mask"/>

                        <path
                            d="
                                M790 220
                                L808 242
                                L790 264
                                L808 286
                                L790 308
                                L808 325
                            "
                            class="glazing"
                        />

                        <text

                            Bifold doors

                    </g>

                    <text x="332" y="183" class="room-name">Utility</text>

                    <text x="332" y="255" class="room-name">Bathroom</text>
                    <text x="332" y="274" class="room-area">≈ 5.0 m²</text>

                    <text x="332" y="353" class="room-name">En Suite</text>
