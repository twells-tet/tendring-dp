<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floorplan | Tarian Newspapers</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .floorplan-wrap {
            width: 100%;
            padding: clamp(1rem, 3vw, 2.5rem);
            box-sizing: border-box;
        }

        .floorplan-card {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(0.75rem, 2vw, 1.5rem);
            background: #fff;
            border: 1px solid var(--border-strong, #333);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .floorplan-svg {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body class="tarian-homepage">

    <header class="page-header tarian-homepage-header" id="top">
        <a href="../index.html" class="page-header-logo-link" aria-label="Tarian Newspapers home">
            <img src="../tarian-shield.svg" alt="" class="page-header-logo">
        </a>
    </header>

    <main class="app-shell">
        <div class="floorplan-wrap">
            <div class="floorplan-card">

                <svg
                    class="floorplan-svg"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 1000 920"
                    role="img"
                    aria-labelledby="proposed-plan-title proposed-plan-desc"
                >
                    <title id="proposed-plan-title">
                        Proposed redevelopment floorplan
                    </title>

                    <desc id="proposed-plan-desc">
                        Approximate proposed floorplan showing two bedrooms, lounge,
                        hallway, bathroom, utility room,
                        open kitchen diner, staircase, porch, bifold doors,
                        paving, French drain, stone garden steps and raised lawn.
                    </desc>

                    <defs>
                        <style>
                            .sheet { fill: #fff; }
                            .room { fill: #fff; }

                            .wall {
                                fill: none;
                                stroke: #111;
                                stroke-width: 14;
                                stroke-linejoin: miter;
                                stroke-linecap: square;
                            }

                            .partition {
                                fill: none;
                                stroke: #111;
                                stroke-width: 8;
                                stroke-linejoin: miter;
                                stroke-linecap: square;
                            }

                            .opening-mask {
                                fill: #fff;
                                stroke: none;
                            }

                            .glazing {
                                fill: none;
                                stroke: #5b7f8d;
                                stroke-width: 5;
                            }

                            .glazing-detail {
                                fill: none;
                                stroke: #5b7f8d;
                                stroke-width: 2;
                            }

                            .stair-outline {
                                fill: #fff;
                                stroke: #333;
                                stroke-width: 3;
                            }

                            .stair-tread {
                                stroke: #777;
                                stroke-width: 2;
                            }

                            .paving {
                                fill: url(#paving-pattern);
                                stroke: #888;
                                stroke-width: 2;
                            }

                            .french-drain {
                                fill: url(#gravel-pattern);
                                stroke: #777;
                                stroke-width: 1.5;
                            }

                            .grass {
                                fill: #dcead5;
                                stroke: #82927a;
                                stroke-width: 2;
                            }

                            .step {
                                fill: #ddd;
                                stroke: #777;
                                stroke-width: 2;
                            }

                            .existing-footprint {
                                fill: none;
                                stroke: #b3261e;
                                stroke-width: 6;
                                stroke-dasharray: 18 12;
                                stroke-linecap: round;
                            }

                            .boundary {
                                stroke: #555;
                                stroke-width: 4;
                                stroke-dasharray: 12 8;
                            }

                            .title {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 34px;
                                font-weight: 800;
                                letter-spacing: 3px;
                                text-anchor: middle;
                                fill: #111;
                            }

                            .subtitle {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 15px;
                                text-anchor: middle;
                                fill: #555;
                            }

                            .room-name {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 18px;
                                font-weight: 700;
                                text-anchor: middle;
                                fill: #111;
                            }

                            .room-area {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                text-anchor: middle;
                                fill: #444;
                            }

                            .small-label {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 12px;
                                font-weight: 700;
                                text-anchor: middle;
                                fill: #222;
                            }

                            .annotation {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                fill: #333;
                            }

                            .dimension {
                                fill: none;
                                stroke: #555;
                                stroke-width: 1.5;
                            }

                            .dimension-extension {
                                fill: none;
                                stroke: #999;
                                stroke-width: 1;
                            }

                            .dimension-text {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                text-anchor: middle;
                                fill: #333;
                            }

                            .scale-text {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 12px;
                                fill: #333;
                            }

                            .north {
                                fill: #111;
                                stroke: #111;
                                stroke-width: 2;
                            }
                        </style>

                        <pattern
                            id="paving-pattern"
                            width="44"
                            height="32"
                            patternUnits="userSpaceOnUse"
                        >
                            <rect width="44" height="32" fill="#e3e3e3"/>
                            <path
                                d="M0 0H44 M0 16H44 M0 32H44
                                   M14 0V16 M34 0V16
                                   M6 16V32 M26 16V32"
                                fill="none"
                                stroke="#c3c3c3"
                                stroke-width="1"
                            />
                        </pattern>

                        <pattern
                            id="gravel-pattern"
                            width="12"
                            height="12"
                            patternUnits="userSpaceOnUse"
                        >
                            <rect width="12" height="12" fill="#eee"/>
                            <circle cx="3" cy="3" r="1" fill="#999"/>
                            <circle cx="9" cy="5" r="1.2" fill="#aaa"/>
                            <circle cx="5" cy="10" r="1" fill="#888"/>
                        </pattern>

                        <marker
                            id="arrow"
                            viewBox="0 0 10 10"
                            refX="5"
                            refY="5"
                            markerWidth="6"
                            markerHeight="6"
                            orient="auto-start-reverse"
                        >
                            <path d="M0 0L10 5L0 10Z" fill="#555"/>
                        </marker>
                    </defs>

                    <rect class="sheet" x="0" y="0" width="1000" height="920"/>

                    <text x="500" y="48" class="title">PROPOSED</text>
                    <text x="500" y="73" class="subtitle">
                        Approximate redevelopment floorplan · dimensions in metres
                    </text>

                    <rect x="410" y="92" width="380" height="42" class="grass"/>
                    <text x="490" y="116" class="small-label">RAISED GARDEN / LAWN</text>

                    <g aria-label="Stone steps to raised garden">
                        <rect x="600" y="134" width="190" height="55" class="step"/>
                        <line x1="600" y1="145" x2="790" y2="145" class="dimension"/>
                        <line x1="600" y1="156" x2="790" y2="156" class="dimension"/>
                        <line x1="600" y1="167" x2="790" y2="167" class="dimension"/>
                        <line x1="600" y1="178" x2="790" y2="178" class="dimension"/>
                        <text x="695" y="126" class="annotation" text-anchor="middle">
                            Stone steps up to raised garden
                        </text>
                    </g>

                    <path
                        class="paving"
                        d="
                            M739 134
                            L880 134
                            L880 793
                            L637 793
                            L637 560
                            L804 560
                            L804 450
                            L739 450

                        "
                    />

                    <path

                            M739 189
                            L759 189
                            L759 450
                            L739 450

                            L637 560
                            L637 793
                            L617 793

                        "
                    />

                    <line x1="880" y1="134" x2="880" y2="793" class="boundary"/>

                    <text
                        x="902"
                        y="440"
                        class="annotation"
                        transform="rotate(90 902 440)"
                        text-anchor="middle"
                    >
                        Approximate property boundary
                    </text>

                    <path class="room" d="M140 560H378V793H140Z"/>
                    <path class="room" d="M378 560H637V793H378Z"/>

                    <path
                        class="room"
                        d="
                            M140 480
                            H410
                            V560
                            H140
                            V555
                            H155
                            V540
                            H140

                        "
                    />

                    <path
                        class="room"
                        d="
                            M140 315
                            H410
                            V480
                            H140
                            Z
                        "
                    />

                    <rect x="255" y="160" width="155" height="52" class="room"/>
                    <rect x="255" y="212" width="155" height="103" class="room"/>

                    <path
                        class="room"
                        d="
                            M410 160
                            H739
                            V450
                            H769
                            V560
                            H410
                            Z
                        "
                    />

                    <rect x="739" y="450" width="65" height="110" class="room"/>

                    <path
                        class="wall"
                        d="
                            M255 160
                            H739
                            V450
                            H804
                            V560
                            H637
                            V793
                            H140
                            V555
                            H155
                            V540
                            H140
                            V315
                            H255
                            Z
                        "
                    />

                    <path class="partition" d="M410 160V560"/>
                    <path class="partition" d="M255 212H410"/>
                    <path class="partition" d="M255 315H410"/>

                    <path class="partition" d="M140 480H410"/>
                    <path class="partition" d="M140 560H637"/>
                    <path class="partition" d="M378 560V793"/>
                    <path class="partition" d="M739 450V560"/>

                    <rect x="285" y="472" width="50" height="17" class="opening-mask"/>
                    <rect x="280" y="552" width="50" height="17" class="opening-mask"/>
                    <rect x="392" y="510" width="17" height="48" class="opening-mask"/>
                    <rect x="500" y="552" width="56" height="17" class="opening-mask"/>
                    <rect x="731" y="485" width="17" height="42" class="opening-mask"/>
                    <rect x="402" y="172" width="17" height="31" class="opening-mask"/>
                    <rect x="402" y="245" width="17" height="34" class="opening-mask"/>

                    <g aria-label="Staircase">
                        <rect x="410" y="325" width="55" height="150" class="stair-outline"/>

                        <line x1="410" y1="340" x2="465" y2="340" class="stair-tread"/>
                        <line x1="410" y1="355" x2="465" y2="355" class="stair-tread"/>
                        <line x1="410" y1="370" x2="465" y2="370" class="stair-tread"/>
                        <line x1="410" y1="385" x2="465" y2="385" class="stair-tread"/>
                        <line x1="410" y1="400" x2="465" y2="400" class="stair-tread"/>
                        <line x1="410" y1="415" x2="465" y2="415" class="stair-tread"/>
                        <line x1="410" y1="430" x2="465" y2="430" class="stair-tread"/>
                        <line x1="410" y1="445" x2="465" y2="445" class="stair-tread"/>
                        <line x1="410" y1="460" x2="465" y2="460" class="stair-tread"/>

                        <line
                            x1="437"
                            y1="452"
                            x2="437"
                            y2="345"
                            class="dimension"
                            marker-end="url(#arrow)"
                        />
                    </g>

                    <line x1="470" y1="160" x2="585" y2="160" class="glazing"/>
                    <line x1="470" y1="154" x2="585" y2="154" class="glazing-detail"/>
                    <line x1="508" y1="151" x2="508" y2="163" class="glazing-detail"/>
                    <line x1="547" y1="151" x2="547" y2="163" class="glazing-detail"/>

                    <text x="528" y="148" class="annotation" text-anchor="middle">
                        Plate glass
                    </text>

                    <g aria-label="Bifold doors">
                        <rect x="731" y="220" width="17" height="105" class="opening-mask"/>

                        <path
                            d="
                                M739 220
                                L757 242
                                L739 264
                                L757 286
                                L739 308
                                L757 325
                            "
                            class="glazing"
                        />

                        <text
                            x="777"
                            y="273"
                            class="annotation"
                            transform="rotate(90 777 273)"
                            text-anchor="middle"
                        >
                            Bifold doors
                        </text>
                    </g>

                    <path
                        class="existing-footprint"
                        d="
                            M140 365
                            H739
                        "
                    />

                    <text x="440" y="352" class="annotation" text-anchor="middle" fill="#b3261e">
                        Approx. original rear wall (existing kitchen 3.22m × 2.35m)
                    </text>

                    <text x="332" y="183" class="room-name">Utility</text>
                    <text x="332" y="200" class="room-area">≈ 2.0 m²</text>

                    <text x="332" y="255" class="room-name">Bathroom</text>
                    <text x="332" y="274" class="room-area">≈ 5.0 m²</text>

                    <text x="275" y="405" class="room-name">Bedroom 1</text>
                    <text x="275" y="424" class="room-area">≈ 9.5 m²</text>

                    <text x="275" y="520" class="room-name">Hallway</text>
                    <text x="275" y="539" class="room-area">≈ 5.0 m²</text>

                    <text x="259" y="660" class="room-name">Bedroom 2</text>
                    <text x="259" y="679" class="room-area">3.47m × 3.44m</text>
                    <text x="259" y="696" class="room-area">≈ 11.9 m²</text>

                    <text x="507" y="660" class="room-name">Lounge</text>
                    <text x="507" y="679" class="room-area">3.78m × 3.35m</text>
                    <text x="507" y="696" class="room-area">≈ 12.7 m²</text>

                    <text x="575" y="390" class="room-name">Kitchen / Diner</text>
                    <text x="575" y="410" class="room-area">Approx. 28–30 m²</text>

                    <text x="772" y="500" class="small-label">PORCH</text>
                    <text x="772" y="518" class="room-area">≈ 3.0 m²</text>

                    <text x="810" y="665" class="annotation" text-anchor="middle">
                        Grey stone paving slabs / setts
                    </text>

                    <text x="810" y="683" class="annotation" text-anchor="middle">
                        wrapping around right-hand side
                    </text>

                    <text
                        x="744"
                        y="720"
                        class="annotation"
                        transform="rotate(90 744 720)"
                        text-anchor="middle"
                    >
                        French drain
                    </text>

                    <line
                        x1="140"
                        y1="831"
                        x2="739"
                        y2="831"
                        class="dimension"
                        marker-start="url(#arrow)"
                        marker-end="url(#arrow)"
                    />

                    <line x1="140" y1="800" x2="140" y2="845" class="dimension-extension"/>
                    <line x1="739" y1="800" x2="739" y2="845" class="dimension-extension"/>

                    <text x="440" y="822" class="dimension-text">
                        Approx. 8.7 m overall width
                    </text>

                    <line
                        x1="930"
                        y1="160"
                        x2="930"
                        y2="793"
                        class="dimension"
                        marker-start="url(#arrow)"
                        marker-end="url(#arrow)"
                    />

                    <line x1="890" y1="160" x2="944" y2="160" class="dimension-extension"/>
                    <line x1="890" y1="793" x2="944" y2="793" class="dimension-extension"/>

                    <text
                        x="950"
                        y="476"
                        class="dimension-text"
                        transform="rotate(90 950 476)"
                    >
                        Approx. 9.2 m overall depth
                    </text>

                    <g transform="translate(70 876)">
                        <text x="0" y="-10" class="scale-text">Graphic scale</text>

                        <rect x="0" y="0" width="55" height="11" fill="#111"/>
                        <rect x="55" y="0" width="55" height="11" fill="#fff" stroke="#111"/>
                        <rect x="110" y="0" width="55" height="11" fill="#111"/>
                        <rect x="165" y="0" width="55" height="11" fill="#fff" stroke="#111"/>
                        <rect x="220" y="0" width="55" height="11" fill="#111"/>

                        <text x="0" y="29" class="scale-text" text-anchor="middle">0</text>
                        <text x="55" y="29" class="scale-text" text-anchor="middle">1</text>
                        <text x="110" y="29" class="scale-text" text-anchor="middle">2</text>
                        <text x="165" y="29" class="scale-text" text-anchor="middle">3</text>
                        <text x="220" y="29" class="scale-text" text-anchor="middle">4</text>
                        <text x="275" y="29" class="scale-text" text-anchor="middle">5 m</text>
                    </g>

                    <g transform="translate(865 850)">
                        <circle cx="0" cy="0" r="28" fill="#fff" stroke="#111" stroke-width="2"/>
                        <path d="M0 -23L9 17L0 10L-9 17Z" class="north"/>
                        <text x="0" y="-36" class="small-label">N</text>
                    </g>

                    <text x="500" y="908" class="subtitle">
                        Concept drawing only — approximate dimensions; not for construction or statutory approval.
                    </text>
                </svg>

            </div>
        </div>
    </main>

</body>
</html>
