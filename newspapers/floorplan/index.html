<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floorplan | Tarian Newspapers</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .floorplan-wrap {
            width: 100%;
            padding: clamp(1rem, 3vw, 2.5rem);
            box-sizing: border-box;
        }

        .floorplan-card {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(0.75rem, 2vw, 1.5rem);
            background: #fff;
            border: 1px solid var(--border-strong, #333);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .floorplan-svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .floorplan-toggle {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .roof-toggle-btn {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 700;
            padding: 0.6rem 1.4rem;
            border-radius: 0.35rem;
            border: 1px solid #111;
            background: #fff;
            color: #111;
            cursor: pointer;
        }

        .roof-toggle-btn:hover {
            background: #111;
            color: #fff;
        }
    </style>
</head>

<body class="tarian-homepage">

    <header class="page-header tarian-homepage-header" id="top">
        <a href="../index.html" class="page-header-logo-link" aria-label="Tarian Newspapers home">
            <img src="../tarian-shield.svg" alt="" class="page-header-logo">
        </a>
    </header>

    <main class="app-shell">
        <div class="floorplan-wrap">
            <div class="floorplan-card">

                <svg
                    class="floorplan-svg"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 1000 920"
                    role="img"
                    aria-labelledby="proposed-plan-title proposed-plan-desc"
                >
                    <title id="proposed-plan-title">
                        Proposed redevelopment floorplan
                    </title>

                    <desc id="proposed-plan-desc">
                        Approximate proposed floorplan showing two bedrooms, lounge,
                        hallway, bathroom, utility room,
                        open kitchen diner, staircase, porch, bifold doors,
                        paving, French drain, stone garden steps and raised lawn.
                    </desc>

                    <defs>
                        <style>
                            .sheet { fill: #fff; }
                            .room { fill: #fff; }

                            .wall {
                                fill: none;
                                stroke: #111;
                                stroke-width: 10;
                                stroke-linejoin: miter;
                                stroke-linecap: square;
                            }

                            .partition {
                                fill: none;
                                stroke: #111;
                                stroke-width: 8;
                                stroke-linejoin: miter;
                                stroke-linecap: square;
                            }

                            .opening-mask {
                                fill: #fff;
                                stroke: none;
                            }

                            .glazing {
                                fill: none;
                                stroke: #5b7f8d;
                                stroke-width: 5;
                            }

                            .glazing-detail {
                                fill: none;
                                stroke: #5b7f8d;
                                stroke-width: 2;
                            }

                            .title {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 34px;
                                font-weight: 800;
                                letter-spacing: 3px;
                                text-anchor: middle;
                                fill: #111;
                            }

                            .subtitle {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 15px;
                                text-anchor: middle;
                                fill: #555;
                            }

                            .room-name {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 18px;
                                font-weight: 700;
                                text-anchor: middle;
                                fill: #111;
                            }

                            .room-area {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                text-anchor: middle;
                                fill: #444;
                            }

                            .small-label {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 12px;
                                font-weight: 700;
                                text-anchor: middle;
                                fill: #222;
                            }

                            .annotation {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                fill: #333;
                            }

                            .dimension {
                                fill: none;
                                stroke: #555;
                                stroke-width: 1.5;
                            }

                            .dimension-extension {
                                fill: none;
                                stroke: #999;
                                stroke-width: 1;
                            }

                            .dimension-text {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                text-anchor: middle;
                                fill: #333;
                            }

                            .scale-text {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 12px;
                                fill: #333;
                            }

                            .north {
                                fill: #111;
                                stroke: #111;
                                stroke-width: 2;
                            }

                            .roof {
                                fill: url(#roof-tile-dark);
                                stroke: #2b2f36;
                                stroke-width: 3;
                            }

                            .ridge {
                                stroke: #161616;
                                stroke-width: 3.5;
                            }

                            .hip {
                                stroke: #161616;
                                stroke-width: 2;
                            }

                            .roof-label {
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 13px;
                                font-weight: 700;
                                text-anchor: middle;
                                fill: #fff;
                            }

                            .chimney {
                                fill: #8a5a44;
                                stroke: #4a3527;
                                stroke-width: 1.5;
                            }

                            .chimney-pot {
                                fill: #3a2c22;
                                stroke: #201811;
                                stroke-width: 1;
                            }
                        </style>

                        <pattern
                            id="roof-tile-dark"
                            width="16"
                            height="10"
                            patternUnits="userSpaceOnUse"
                        >
                            <rect width="16" height="10" fill="#5b6472"/>
                            <path d="M0 0H16 M0 5H16" stroke="#454d59" stroke-width="1"/>
                            <path d="M8 0V10" stroke="#454d59" stroke-width="0.5"/>
                        </pattern>

                        <marker
                            id="arrow"
                            viewBox="0 0 10 10"
                            refX="5"
                            refY="5"
                            markerWidth="6"
                            markerHeight="6"
                            orient="auto-start-reverse"
                        >
                            <path d="M0 0L10 5L0 10Z" fill="#555"/>
                        </marker>
                    </defs>

                    <rect class="sheet" x="0" y="0" width="1000" height="920"/>

                    <text x="500" y="48" class="title">BUNGALOW</text>
                    <text x="500" y="73" class="subtitle">
                        Approximate floorplan · dimensions in metres
                    </text>

                    <g class="floor-plan-only">
                    <rect x="140" y="160" width="497" height="633" class="room"/>

                    <path
                        class="wall"
                        d="
                            M140 160
                            H637
                            V793
                            H140
                            Z
                        "
                    />

                    <path class="partition" d="M140 430H637"/>
                    <path class="partition" d="M140 560H637"/>
                    <path class="partition" d="M330 160V430"/>
                    <path class="partition" d="M480 160V430"/>
                    <path class="partition" d="M560 160V430"/>
                    <path class="partition" d="M560 430V560"/>
                    <path class="partition" d="M380 560V793"/>

                    <rect x="200" y="424" width="50" height="12" class="opening-mask"/>
                    <rect x="380" y="424" width="50" height="12" class="opening-mask"/>
                    <rect x="474" y="270" width="12" height="50" class="opening-mask"/>
                    <rect x="580" y="424" width="40" height="12" class="opening-mask"/>
                    <rect x="554" y="470" width="12" height="50" class="opening-mask"/>
                    <rect x="235" y="554" width="50" height="12" class="opening-mask"/>
                    <rect x="483" y="554" width="50" height="12" class="opening-mask"/>
                    <rect x="575" y="554" width="40" height="12" class="opening-mask"/>
                    <rect x="560" y="787" width="45" height="14" class="opening-mask"/>

                    <line x1="582" y1="793" x2="582" y2="743" class="glazing"/>

                    <line x1="180" y1="160" x2="280" y2="160" class="glazing"/>
                    <line x1="345" y1="160" x2="465" y2="160" class="glazing"/>
                    <line x1="520" y1="160" x2="600" y2="160" class="glazing"/>
                    <line x1="140" y1="650" x2="140" y2="740" class="glazing"/>
                    <line x1="637" y1="650" x2="637" y2="740" class="glazing"/>
                    </g>

                    <g id="roof-plan" style="display:none">
                        <path class="roof" d="M140 160 H637 V793 H140 Z"/>
                        <line class="ridge" x1="388.5" y1="160" x2="388.5" y2="793"/>
                        <text x="388" y="480" class="roof-label">SIMPLE PITCHED ROOF</text>
                        <text x="388" y="500" class="roof-label">(ridge shown)</text>

                        <rect x="371" y="668" width="26" height="32" class="chimney"/>
                        <circle cx="378" cy="668" r="4" class="chimney-pot"/>
                        <circle cx="390" cy="668" r="4" class="chimney-pot"/>
                        <text x="384" y="720" class="roof-label">Chimney (shared Lounge / K-D flues)</text>
                    </g>

                    <g class="floor-plan-only">
                    <text x="235" y="290" class="room-name">Bedroom 1</text>
                    <text x="235" y="308" class="room-area">≈ 11.1 m²</text>

                    <text x="405" y="290" class="room-name">Bedroom 2</text>
                    <text x="405" y="308" class="room-area">≈ 8.8 m²</text>

                    <text x="520" y="290" class="room-name">En-suite</text>
                    <text x="520" y="308" class="room-area">≈ 4.7 m²</text>

                    <text x="598" y="290" class="room-name">W/C</text>
                    <text x="598" y="308" class="room-area">≈ 4.5 m²</text>

                    <text x="598" y="489" class="room-name">Utility</text>
                    <text x="598" y="507" class="room-area">≈ 2.2 m²</text>

                    <text x="260" y="670" class="room-name">Lounge</text>
                    <text x="260" y="688" class="room-area">≈ 12.1 m²</text>

                    <text x="508" y="670" class="room-name">Kitchen / Diner</text>
                    <text x="508" y="688" class="room-area">≈ 13.0 m²</text>

                    <text x="350" y="489" class="room-name">Hallway</text>
                    <text x="350" y="507" class="room-area">≈ 11.8 m²</text>
                    </g>

                    <line
                        x1="140"
                        y1="831"
                        x2="637"
                        y2="831"
                        class="dimension"
                        marker-start="url(#arrow)"
                        marker-end="url(#arrow)"
                    />

                    <line x1="140" y1="800" x2="140" y2="845" class="dimension-extension"/>
                    <line x1="637" y1="800" x2="637" y2="845" class="dimension-extension"/>

                    <text x="388" y="822" class="dimension-text">
                        Approx. 7.3 m overall width
                    </text>

                    <line
                        x1="930"
                        y1="160"
                        x2="930"
                        y2="793"
                        class="dimension"
                        marker-start="url(#arrow)"
                        marker-end="url(#arrow)"
                    />

                    <line x1="890" y1="160" x2="944" y2="160" class="dimension-extension"/>
                    <line x1="890" y1="793" x2="944" y2="793" class="dimension-extension"/>

                    <text
                        x="950"
                        y="476"
                        class="dimension-text"
                        transform="rotate(90 950 476)"
                    >
                        Approx. 9.2 m overall depth
                    </text>

                    <g transform="translate(70 876)">
                        <text x="0" y="-10" class="scale-text">Graphic scale</text>

                        <rect x="0" y="0" width="55" height="11" fill="#111"/>
                        <rect x="55" y="0" width="55" height="11" fill="#fff" stroke="#111"/>
                        <rect x="110" y="0" width="55" height="11" fill="#111"/>
                        <rect x="165" y="0" width="55" height="11" fill="#fff" stroke="#111"/>
                        <rect x="220" y="0" width="55" height="11" fill="#111"/>

                        <text x="0" y="29" class="scale-text" text-anchor="middle">0</text>
                        <text x="55" y="29" class="scale-text" text-anchor="middle">1</text>
                        <text x="110" y="29" class="scale-text" text-anchor="middle">2</text>
                        <text x="165" y="29" class="scale-text" text-anchor="middle">3</text>
                        <text x="220" y="29" class="scale-text" text-anchor="middle">4</text>
                        <text x="275" y="29" class="scale-text" text-anchor="middle">5 m</text>
                    </g>

                    <g transform="translate(70 70)">
                        <circle cx="0" cy="0" r="28" fill="#fff" stroke="#111" stroke-width="2"/>
                        <path d="M0 -23L9 17L0 10L-9 17Z" class="north" transform="rotate(-80)"/>
                        <text x="-35" y="-3" class="small-label">N</text>
                    </g>

                    <text x="500" y="908" class="subtitle">
                        Concept drawing only — approximate dimensions; not for construction or statutory approval.
                    </text>
                </svg>

                <div class="floorplan-toggle">
                    <button type="button" id="roof-toggle-btn" class="roof-toggle-btn" aria-pressed="false">
                        Show roof plan
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script>
        (function () {
            var btn = document.getElementById('roof-toggle-btn');
            var roofPlan = document.getElementById('roof-plan');
            var floorPlanParts = document.querySelectorAll('.floor-plan-only');

            if (!btn || !roofPlan) return;

            var showingRoof = false;

            btn.addEventListener('click', function () {
                showingRoof = !showingRoof;

                roofPlan.style.display = showingRoof ? '' : 'none';
                floorPlanParts.forEach(function (el) {
                    el.style.display = showingRoof ? 'none' : '';
                });

                btn.textContent = showingRoof ? 'Show floor plan' : 'Show roof plan';
                btn.setAttribute('aria-pressed', showingRoof ? 'true' : 'false');
            });
        })();
    </script>

</body>
</html>
