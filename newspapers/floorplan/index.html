<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floorplan | Tarian Newspapers</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .floorplan-wrap {
            width: 100%;
            padding: clamp(1rem, 3vw, 2.5rem);
            box-sizing: border-box;
        }

        .floorplan-card {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(0.75rem, 2vw, 1.5rem);
            background: #fff;
            border: 1px solid var(--border-strong, #333);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .floorplan-svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .floorplan-toggle {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .floorplan-toggle {
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .floor-toggle-btn,
        .property-title-link {
            box-sizing: border-box;
            width: 160px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .floor-toggle-btn {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 700;
            border-radius: 0.35rem;
            border: 1px solid var(--plaid-red, #da291c);
            background: #fff;
            color: var(--plaid-red, #da291c);
            cursor: pointer;
        }

        .floor-toggle-btn:hover {
            background: var(--plaid-red-dark, #a31f16);
            border-color: var(--plaid-red-dark, #a31f16);
            color: #fff;
        }

        .floor-toggle-btn[aria-pressed="true"] {
            background: var(--plaid-red, #da291c);
            border-color: var(--plaid-red, #da291c);
            color: #fff;
        }

        .property-title-link {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 0.35rem;
            border: none;
            background: var(--plaid-green, #0aa77d);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .property-title-link:hover {
            background: var(--plaid-green-dark, #0a5e49);
        }
    </style>
</head>

                        <text x="-50" y="534" class="plant-label">ASHP &amp;</text>
                        <text x="-50" y="547" class="plant-label">A/C Unit</text>

                        <text x="130" y="650" class="floor-label">Second Floor</text>
                    </g>
                </svg>

                <div class="floorplan-toggle">
                    <button type="button" class="floor-toggle-btn" data-target="ground-floor-outline" aria-pressed="true">
                        Ground Floor
                    </button>
                    <button type="button" class="floor-toggle-btn" data-target="first-floor-outline" aria-pressed="true">
                        First Floor
                    </button>
                    <button type="button" class="floor-toggle-btn" data-target="second-floor-outline" aria-pressed="true">
                        Second Floor
                    </button>
                </div>

                <div class="floorplan-toggle">
                    <a href="../costings/" class="property-title-link">52 STRYD FAWR</a>
                </div>

            </div>
        </div>
    </main>

    <script>
        (function () {
            var buttons = document.querySelectorAll('.floor-toggle-btn');

            buttons.forEach(function (btn) {
                var target = document.getElementById(btn.getAttribute('data-target'));

                if (!target) {
                    return;
                }

                btn.addEventListener('click', function () {
                    var isShown = btn.getAttribute('aria-pressed') === 'true';
                    var next = !isShown;

                    target.style.display = next ? '' : 'none';
                    btn.setAttribute('aria-pressed', next ? 'true' : 'false');
                });
            });
        })();
    </script>
