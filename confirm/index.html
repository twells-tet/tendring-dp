<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Confirm Bet | 326</title>
  <link rel="icon" href="/326/icon.svg" type="image/svg+xml">
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #142338;
      background: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
    }

    .site-header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      border-bottom: 1px solid #273b55;
      background: #142338;
      color: #fff;
    }

    .wordmark {
      color: inherit;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.06em;
      text-decoration: none;
    }

    .wordmark::first-letter {
      color: #47d3b1;
    }

    main {
      width: min(100% - 2rem, 640px);
      margin: 0 auto;
      padding: 3rem 0;
    }

    .confirmation {
      overflow: hidden;
      border: 1px solid #dbe2ea;
      border-radius: 0.5rem;
      background: #fff;
      box-shadow: 0 1px 2px rgb(20 35 56 / 4%);
    }

    .confirmation header,
    .confirmation-body {
      padding: 1.5rem;
    }

    .confirmation header {
      border-bottom: 1px solid #e6ebf0;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: #627187;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.85rem 1.5rem;
      margin: 0;
    }

    dt {
      color: #627187;
      font-size: 0.8rem;
      font-weight: 700;
    }

    dd {
      margin: 0;
      font-weight: 750;
      text-align: right;
    }

    .customer-details {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e6ebf0;
    }

    .customer-details h2 {
      margin: 0;
      font-size: 1rem;
    }

    .field {
      display: grid;
      gap: 0.4rem;
    }

    label {
      color: #627187;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.7rem 0.75rem;
      border: 1px solid #b9c4d0;
      border-radius: 0.35rem;
      background: #fff;
      color: #142338;
      font: inherit;
    }

    textarea {
      height: 2.8rem;
      resize: none;
    }

    input:focus,
    textarea:focus {
      border-color: #278c77;
      outline: 3px solid rgb(71 211 177 / 25%);
    }

    .place-bet {
      min-width: 9rem;
      padding: 0.7rem 1rem;
      border: 1px solid #278c77;
      border-radius: 0.35rem;
      background: #278c77;
      color: #fff;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .place-bet:hover,
    .place-bet:focus-visible {
      border-color: #1e6c5d;
      background: #1e6c5d;
    }

    .place-bet:focus-visible {
      outline: 3px solid rgb(71 211 177 / 45%);
      outline-offset: 2px;
    }

    .payment-status {
      min-height: 1rem;
      margin: 0;
      color: #627187;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .proposal-notice {
      margin: -0.25rem 0 0;
      color: #627187;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .bet-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .propose-bet {
      border-color: #142338;
      background: #142338;
    }

    .propose-bet:hover,
    .propose-bet:focus-visible {
      border-color: #273b55;
      background: #273b55;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #1e6c5d;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: #142338;
    }

    @media (max-width: 560px) {
      .site-header {
        height: 56px;
        padding: 0 1.25rem;
      }

      main {
        width: min(100% - 1.5rem, 640px);
        padding: 1.5rem 0;
      }

      .confirmation header,
      .confirmation-body {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/326/" aria-label="326 home">326</a>
  </header>
  <main>
    <section class="confirmation" aria-labelledby="confirmation-title">
      <header>
        <p class="eyebrow">Bet confirmation</p>
        <h1 id="confirmation-title">Review your selection</h1>
      </header>
      <div class="confirmation-body">
        <dl>
          <dt>Market</dt>
          <dd>Next United Kingdom General Election: Most Seats</dd>
          <dt>Selection</dt>
          <dd id="party"></dd>
          <dt>Odds</dt>
          <dd id="odds"></dd>
          <dt>Stake</dt>
          <dd id="stake"></dd>
        </dl>
        <form class="customer-details">
          <h2>Your details</h2>
          <div class="field">
            <label for="full-name">Full Name</label>
            <input id="full-name" name="full-name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="address">Address</label>
            <textarea id="address" name="address" autocomplete="street-address" required></textarea>
          </div>
          <div class="field">
            <label for="postcode">Postcode</label>
            <input id="postcode" name="postcode" type="text" autocomplete="postal-code" required>
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="bet-actions">
            <button id="place-bet" class="place-bet" type="submit">Place Bet</button>
            <button id="propose-bet" class="place-bet propose-bet" type="button" hidden>Propose Bet</button>
          </div>
          <p id="proposal-notice" class="proposal-notice" hidden>Stakes of £1000 or more will be provided to you by email, as an invoice. The bet is not confirmed until the invoice is settled in full.</p>
          <p id="payment-status" class="payment-status" aria-live="polite"></p>
        </form>
        <a class="back-link" href="/326/">Change selection</a>
      </div>
    </section>
  </main>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const party = parameters.get("party") || "No selection";
    const fractional = parameters.get("fractional") || "—";
    const decimal = Number(parameters.get("decimal"));
    const stake = Number(parameters.get("stake"));
    const currency = parameters.get("currency");
    const gbpStake = Number(parameters.get("gbpStake"));
    const form = document.querySelector(".customer-details");
    const placeBetButton = document.getElementById("place-bet");
    const proposeBetButton = document.getElementById("propose-bet");
    const proposalNotice = document.getElementById("proposal-notice");
    const paymentStatus = document.getElementById("payment-status");
    const stakeInGbp = currency === "btc" ? gbpStake : stake;
    const requiresProposal = Number.isFinite(stakeInGbp) && stakeInGbp > 999;

    document.getElementById("party").textContent = party;
    document.getElementById("odds").textContent = Number.isFinite(decimal)
      ? fractional + " (" + decimal.toFixed(2) + ")"
      : fractional;
    document.getElementById("stake").textContent = Number.isFinite(stake)
      ? currency === "btc"
        ? stake.toFixed(7) + " BTC"
        : new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" }).format(stake)
      : "—";
    placeBetButton.disabled = requiresProposal;
    placeBetButton.hidden = requiresProposal;
    proposeBetButton.hidden = !requiresProposal;
    proposalNotice.hidden = !requiresProposal;

    form.addEventListener("submit", event => {
      event.preventDefault();
      paymentStatus.textContent =
        "Stripe payment will be available here shortly.";
    });
    proposeBetButton.addEventListener("click", () => {
      if (!form.reportValidity()) return;

      const body = [
        "Market: Next United Kingdom General Election: Most Seats",
        "Selection: " + party,
        "Odds: " + fractional + " (" + decimal.toFixed(2) + ")",
        "Stake: " + document.getElementById("stake").textContent,
        "GBP equivalent: " + new Intl.NumberFormat("en-GB", {
          style: "currency",
          currency: "GBP"
        }).format(stakeInGbp),
        "",
        "Full Name: " + document.getElementById("full-name").value,
        "Address: " + document.getElementById("address").value,
        "Postcode: " + document.getElementById("postcode").value,
        "Email Address: " + document.getElementById("email").value
      ].join("\n");
      window.location.assign(
        "mailto:chris@trinitystreetcomms.co.uk?subject=" +
        encodeURIComponent("Proposed 326 election market bet") +
        "&body=" + encodeURIComponent(body)
      );
    });
  </script>
</body>
</html>
