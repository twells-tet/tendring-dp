<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NWWT | TARIAN</title>
  <link rel="icon" type="image/svg+xml" href="/beta/tarian-shield.svg">
  <link rel="stylesheet" href="/beta/style.css">
  <style>
    body {
      background: #fff;
    }

    .nwwt-header {
      background: #fff;
      border-bottom: 0.35rem solid var(--plaid-green, #005f3b);
    }

    .nwwt-logo {
      display: block;
      width: min(100%, 360px);
      height: auto;
      margin: 1.5rem auto 0;
    }

    .nwwt-details {
      margin: 1.5rem 0;
      padding: 0 1rem;
      color: var(--plaid-green-dark, #00452b);
      text-align: left;
    }

    .nwwt-details h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .nwwt-details p {
      margin: 0.5rem 0 0;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <header class="page-header nwwt-header">
    <img src="nwwt-logo.png" alt="North Wales Wildlife Trust" class="nwwt-logo">
  </header>
  <main class="app-shell">
    <section class="nwwt-details">
      <h1>Chris Twells</h1>
      <p>First Round Interview: 20 August 2026</p>
    </section>
  </main>
</body>
</html>
