<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscriptions | TARIAN</title>
  <link rel="icon" type="image/svg+xml" href="tarian-shield.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .subscriptions-table-wrapper {
      overflow-x: auto;
    }

    .subscriptions-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .subscriptions-table th,
    .subscriptions-table td {
      text-align: left;
      padding: 0.4rem 0.6rem;
      border: 1px solid #ddd;
    }

    .subscriptions-table th {
      background: #f4f4f4;
      position: sticky;
      top: 0;
    }

    .subscriptions-table td.subscriptions-week-cell {
      text-align: center;
    }

    .subscriptions-table td.subscriptions-week-cell.subscriptions-week-paid {
      background: #c8e6c9;
    }

    .subscriptions-table td.subscriptions-address-cell {
      white-space: normal;
      line-height: 1.3;
    }

    .subscriptions-table td.subscriptions-summary-cell {
      white-space: normal;
      line-height: 1.3;
    }

    .subscriptions-table th.subscriptions-week-header {
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.3;
    }

    .subscriptions-paid-checkbox {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="page-header-logo-link" aria-label="TARIAN home">
      <img src="tarian-shield.svg" alt="" class="page-header-logo">
    </a>
    <h1>TARIAN</h1>
    <p class="page-subtitle">Subscriptions</p>
  </header>

  <main class="app-shell">

    <section class="panel">

      <h2>Newspaper Subscriptions</h2>

      <p><a href="index.html" class="back-link">&larr; back to main list</a></p>

      <p id="subscriptions-message" class="message" role="status" aria-live="polite"></p>

      <div class="subscriptions-table-wrapper">
        <table class="subscriptions-table">
          <thead>
            <tr id="subscriptions-header-row">
              <th>Payment Summary</th>
              <th>Customer</th>
              <th>Address</th>
              <th>Phone</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="subscriptions-body"></tbody>
        </table>
      </div>

    </section>

  </main>

  <script>

    const STORAGE_KEYS = {
      paidStatus: "abersoch-subscription-paid-status"
    };

    const NEWSPAPERS_SHEET_URL =
      "https://docs.google.com/spreadsheets/d/1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE/export?format=csv&gid=268358424";

    const ELECTORS_SHEET_URL =
      "https://docs.google.com/spreadsheets/d/1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE/export?format=csv&gid=0";

    const WEEKS_AHEAD = 5;

    const messageEl = document.getElementById("subscriptions-message");
    const headerRowEl = document.getElementById("subscriptions-header-row");
    const bodyEl = document.getElementById("subscriptions-body");

    const paidStatus =
      JSON.parse(localStorage.getItem(STORAGE_KEYS.paidStatus) || "{}");

    function savePaidStatus() {
      localStorage.setItem(STORAGE_KEYS.paidStatus, JSON.stringify(paidStatus));
    }

    function normalizeHeader(value) {
      return (value || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    async function fetchSheetRows(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("Could not fetch sheet data.");
      }
      const csvText = await response.text();
      return parseCsv(csvText);
    }

    function parseCsv(csvText) {

      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i += 1) {

        const char = csvText[i];
        const next = csvText[i + 1];

        if (char === "\"" && inQuotes && next === "\"") {
          value += "\"";
          i += 1;
          continue;
        }

        if (char === "\"") {
          inQuotes = !inQuotes;
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") {
            i += 1;
          }
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          continue;
        }

        value += char;

      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ""));

    }

    function rowsToObjects(rows) {
      const headers = rows[0].map(h => normalizeHeader(h));
      return rows.slice(1).map(row => {
        const data = {};
        headers.forEach((header, idx) => {
          data[header] = (row[idx] || "").trim();
        });
        return data;
      });
    }

    function toSentenceCase(value) {
      if (!value) return "";
      return value
        .toLowerCase()
        .replace(/(^|\s)\S/g, letter => letter.toUpperCase());
    }

    function formatAddress(sub) {
      const lines = [sub.addressline1, sub.addressline2, sub.addressline3]
        .filter(part => part);
      const lastLine = [toSentenceCase(sub.posttown), sub.postcode]
        .filter(part => part)
        .join(" ");
      if (lastLine) lines.push(lastLine);
      return lines.join("<br>");
    }

    function parseCurrency(value) {
      const num = parseFloat((value || "").replace(/[^0-9.]/g, ""));
      return isNaN(num) ? 0 : num;
    }

    function parseUkDate(value) {
      if (!value) return null;
      const match = value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (!match) return null;
      const day = parseInt(match[1], 10);
      const month = parseInt(match[2], 10) - 1;
      let year = parseInt(match[3], 10);
      if (year < 100) year += 2000;
      const date = new Date(year, month, day);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function formatDayMonth(date) {
      const day = date.getDate();
      const month = date.toLocaleString("en-GB", { month: "long" });
      return day + " " + month;
    }

    function calculateNextPaymentDue(subscriber) {
      const startDate =
        parseUkDate(subscriber.subscriptionStartDate) ||
        new Date(new Date().getFullYear(), 7, 10);
      const weeklyCost = parseCurrency(subscriber.weeklyCost);
      const fundsReceived = parseCurrency(subscriber.fundsReceived);
      if (!weeklyCost) return null;
      const weeksCovered = Math.floor(fundsReceived / weeklyCost);
      return addDays(startDate, weeksCovered * 7);
    }

    function formatPaymentSummary(subscriber, weeks) {
      const dueDate = calculateNextPaymentDue(subscriber);
      const nextDue = dueDate
        ? formatDayMonth(dueDate)
        : (weeks.length > 1 ? formatDayMonth(weeks[1]) : "");
      return (
        "Weekly Cost: " + subscriber.weeklyCost + "<br>" +
        "Funds Received: " + subscriber.fundsReceived + "<br>" +
        "<strong>Next Payment Due Before: " + nextDue + "</strong>"
      );
    }

    function getMonday(date) {
      const result = new Date(date);
      const day = result.getDay();
      const diffToMonday = (day + 6) % 7;
      result.setDate(result.getDate() - diffToMonday);
      result.setHours(0, 0, 0, 0);
      return result;
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function toIsoDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function formatWeekLabel(date) {
      const day = date.getDate();
      const month = date.toLocaleString("en-GB", { month: "long" });
      return "WEEK COMMENCING<br>" + day + " " + month;
    }

    function getUpcomingWeeks() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const firstWeek = getMonday(today);

      const weeks = [];
      for (let i = 0; i < WEEKS_AHEAD; i += 1) {
        weeks.push(addDays(firstWeek, i * 7));
      }
      return weeks;
    }

    async function init() {

      messageEl.textContent = "Loading subscribers...";

      try {

        const [newspapersRows, electorsRows] = await Promise.all([
          fetchSheetRows(NEWSPAPERS_SHEET_URL),
          fetchSheetRows(ELECTORS_SHEET_URL)
        ]);

        const newspapers = rowsToObjects(newspapersRows);
        const electors = rowsToObjects(electorsRows);

        const electorsByHousehold = {};
        electors.forEach(elector => {
          const householdId = elector.householdid;
          if (householdId && !electorsByHousehold[householdId]) {
            electorsByHousehold[householdId] = elector;
          }
        });

        const subscribers = newspapers
          .filter(sub => sub.subscription)
          .map(sub => {
            const elector = electorsByHousehold[sub.householdid] || {};
            return {
              householdId: sub.householdid,
              customerName: sub.customername,
              subscription: sub.subscription,
              address: formatAddress(sub),
              phone: elector.phone || "",
              email: elector.email || "",
              weeklyCost: sub.weeklycost || "",
              fundsReceived: sub.fundsreceived || "",
              subscriptionStartDate: sub.subscriptionstartdate || ""
            };
          });

        renderTable(subscribers);

        messageEl.textContent = subscribers.length
          ? ""
          : "No active subscribers found.";

      } catch (error) {
        messageEl.textContent = "Unable to load sheet: " + error.message;
      }

    }

    function isWeekPaid(subscriber, week) {
      const startDate =
        parseUkDate(subscriber.subscriptionStartDate) ||
        new Date(new Date().getFullYear(), 7, 10);
      const weeklyCost = parseCurrency(subscriber.weeklyCost);
      const fundsReceived = parseCurrency(subscriber.fundsReceived);
      if (!weeklyCost) return false;
      const weeksCovered = Math.floor(fundsReceived / weeklyCost);
      if (weeksCovered <= 0) return false;
      const paidUntil = addDays(startDate, weeksCovered * 7);
      return week.getTime() >= startDate.getTime() && week.getTime() < paidUntil.getTime();
    }

    function renderTable(subscribers) {

      const weeks = getUpcomingWeeks();

      weeks.forEach(week => {
        const th = document.createElement("th");
        th.className = "subscriptions-week-header";
        th.innerHTML = formatWeekLabel(week);
        headerRowEl.appendChild(th);
      });

      bodyEl.innerHTML = subscribers
        .map(subscriber => {

          const weekCells = weeks
            .map(week => {
              const weekIso = toIsoDate(week);
              const key = subscriber.householdId + "|" + weekIso;
              const autoPaid = isWeekPaid(subscriber, week);
              const isChecked =
                paidStatus[key] !== undefined ? paidStatus[key] : autoPaid;
              const checked = isChecked ? "checked" : "";
              const paidClass = isChecked ? " subscriptions-week-paid" : "";
              return (
                "<td class=\"subscriptions-week-cell" + paidClass + "\">" +
                "<input type=\"checkbox\" class=\"subscriptions-paid-checkbox\" disabled data-key=\"" +
                key +
                "\" " +
                checked +
                ">" +
                "</td>"
              );
            })
            .join("");

          return (
            "<tr>" +
            "<td class=\"subscriptions-summary-cell\">" + formatPaymentSummary(subscriber, weeks) + "</td>" +
            "<td>" + (subscriber.customerName || "") + "<br>" + (subscriber.subscription || "") + "</td>" +
            "<td class=\"subscriptions-address-cell\">" + (subscriber.address || "") + "</td>" +
            "<td>" + (subscriber.phone || "") + "</td>" +
            "<td>" + (subscriber.email || "") + "</td>" +
            weekCells +
            "</tr>"
          );

        })
        .join("");

      if (!subscribers.length) {
        bodyEl.innerHTML =
          "<tr><td colspan=\"" + (5 + weeks.length) + "\" class=\"empty-state\">No active subscribers found.</td></tr>";
      }

      bodyEl.querySelectorAll(".subscriptions-paid-checkbox").forEach(input => {
        input.addEventListener("change", event => {
          const key = event.target.dataset.key;
          paidStatus[key] = event.target.checked;
          savePaidStatus();
          event.target.closest("td").classList.toggle(
            "subscriptions-week-paid",
            event.target.checked
          );
        });
      });

    }

    init();

  </script>
</body>
</html>
