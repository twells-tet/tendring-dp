<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harlech a Llanbedr Mapping | TARIAN</title>
  <link rel="icon" type="image/svg+xml" href="/beta/tarian-shield.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/beta/style.css">
  <style>
    .harlech-map {
      width: 100%;
      height: min(72vw, 760px);
      min-height: 440px;
      border-radius: 0.5rem;
    }

    .mapping-summary {
      margin: 0 0 1rem;
    }

    .district-key {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin: 0 0 1rem;
      font-size: 0.9rem;
    }

    .district-key-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .district-key-swatch {
      width: 0.8rem;
      height: 0.8rem;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <a href="/beta/" class="page-header-logo-link" aria-label="TARIAN home">
      <img src="/beta/tarian-shield.svg" alt="" class="page-header-logo">
    </a>
    <h1>TARIAN</h1>
    <p class="page-subtitle">Harlech a Llanbedr Mapping</p>
  </header>
  <main class="app-shell">
    <section class="panel">
      <h2>Mapping</h2>
      <p><a href="index.html" class="back-link">&larr; Back to Harlech a Llanbedr</a></p>
      <p id="mapping-summary" class="mapping-summary" role="status">Loading map data...</p>
      <div id="district-key" class="district-key" aria-label="Polling district key"></div>
      <div id="harlech-map" class="harlech-map" aria-label="Map of Harlech a Llanbedr elector totals by postcode"></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const sheetUrl =
      "https://docs.google.com/spreadsheets/d/1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE/export?format=csv&gid=439559888";
    const map = L.map("harlech-map", { attributionControl: false });
    const summary = document.getElementById("mapping-summary");
    const districtKey = document.getElementById("district-key");
    const DISTRICT_COLORS = {
      N1: "#2167b5",
      AF1: "#1b8a5a",
      AE1: "#d76a17",
      AU1: "#7a4fb3",
      N2: "#bf3c69"
    };
    const DISTRICT_NAMES = {
      N1: "Harlech",
      AF1: "Talsarnau",
      AE1: "Llanbedr",
      AU1: "Llanfair",
      N2: "Llanfair"
    };
    const FALLBACK_COLORS = ["#2167b5", "#1b8a5a", "#d76a17", "#7a4fb3", "#bf3c69"];

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18
    }).addTo(map);

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (character === "\"") {
          if (quoted && text[index + 1] === "\"") {
            value += "\"";
            index += 1;
          } else {
            quoted = !quoted;
          }
        } else if (character === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((character === "\n" || character === "\r") && !quoted) {
          if (character === "\r" && text[index + 1] === "\n") index += 1;
          row.push(value);
          if (row.some(cell => cell.trim())) rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }

      if (value || row.length) {
        row.push(value);
        rows.push(row);
      }
      return rows;
    }

    fetch(sheetUrl)
      .then(response => {
        if (!response.ok) throw new Error("Could not load mapping data.");
        return response.text();
      })
      .then(text => {
        const rows = parseCsv(text);
        const points = rows.slice(1).map(row => ({
          postcode: row[0].trim(),
          electors: Number(row[1]) || 0,
          latitude: Number(row[2]),
          longitude: Number(row[3]),
          pollingDistrict: row[4].trim() || "Unassigned"
        })).filter(point => point.postcode && Number.isFinite(point.latitude) && Number.isFinite(point.longitude));

        if (!points.length) throw new Error("No mappable locations were found.");

        const bounds = L.latLngBounds();
        const totalElectors = points.reduce((total, point) => total + point.electors, 0);
        const districts = [...new Set(points.map(point => point.pollingDistrict))].sort();
        const districtColors = new Map(
          districts.map((district, index) => [
            district,
            DISTRICT_COLORS[district] || FALLBACK_COLORS[index % FALLBACK_COLORS.length]
          ])
        );

        districtKey.innerHTML = districts.map(district =>
          "<span class=\"district-key-item\"><span class=\"district-key-swatch\" style=\"background:" +
          districtColors.get(district) +
          ";\"></span>" +
          district + " (" + (DISTRICT_NAMES[district] || district) + ")" +
          "</span>"
        ).join("");

        points.forEach(point => {
          const color = districtColors.get(point.pollingDistrict);
          const marker = L.circleMarker([point.latitude, point.longitude], {
            radius: Math.max(6, Math.min(18, Math.sqrt(point.electors) * 1.5)),
            stroke: false,
            fillColor: color,
            fillOpacity: 0.75
          }).addTo(map);
          marker.bindPopup(
            "<strong>" + point.postcode + "</strong><br>" +
            point.pollingDistrict + " (" +
            (DISTRICT_NAMES[point.pollingDistrict] || point.pollingDistrict) +
            ")<br>" +
            point.electors.toLocaleString("en-GB") + " electors"
          );
          bounds.extend([point.latitude, point.longitude]);
        });

        map.fitBounds(bounds, { padding: [28, 28] });
        summary.textContent =
          points.length.toLocaleString("en-GB") + " postcode locations · " +
          totalElectors.toLocaleString("en-GB") + " electors";
      })
      .catch(error => {
        map.setView([52.856, -4.108], 12);
        summary.textContent = error.message;
      });
  </script>
</body>
</html>
