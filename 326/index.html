<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>326</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #142338;
      background: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
    }

    .site-header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 2.25rem;
      padding: 0 2rem;
      border-bottom: 1px solid #273b55;
      background: #142338;
      color: #fff;
    }

    .wordmark {
      color: inherit;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.06em;
      text-decoration: none;
    }

    .wordmark::first-letter {
      color: #47d3b1;
    }

    .primary-nav {
      display: flex;
      align-self: stretch;
      align-items: center;
      gap: 1.75rem;
      margin-left: auto;
    }

    .primary-nav a {
      display: flex;
      align-items: center;
      height: 100%;
      border-bottom: 3px solid transparent;
      color: #c8d1dc;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
    }

    .primary-nav a:hover,
    .primary-nav a:focus-visible {
      border-bottom-color: #47d3b1;
      color: #fff;
      outline: none;
    }

    main {
      width: min(100% - 2rem, 960px);
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      padding: 3rem 0;
    }

    .market {
      overflow: hidden;
      border: 1px solid #dbe2ea;
      border-radius: 0.5rem;
      background: #fff;
      box-shadow: 0 1px 2px rgb(20 35 56 / 4%);
    }

    .market-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e6ebf0;
    }

    .market-header p {
      margin: 0 0 0.35rem;
      color: #627187;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .market-header h1 {
      margin: 0;
      color: #142338;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .stake-panel {
      display: flex;
      align-items: end;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e6ebf0;
      background: #fafbfd;
    }

    .stake-field {
      display: grid;
      gap: 0.35rem;
      width: min(100%, 13rem);
    }

    .stake-field label {
      color: #627187;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .stake-input-wrap {
      position: relative;
    }

    .stake-input-wrap span {
      position: absolute;
      top: 50%;
      left: 0.75rem;
      color: #627187;
      font-weight: 650;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .stake-field input {
      width: 100%;
      padding: 0.7rem 0.75rem 0.7rem 1.75rem;
      border: 1px solid #b9c4d0;
      border-radius: 0.35rem;
      background: #fff;
      color: #142338;
      font: inherit;
      font-variant-numeric: tabular-nums;
    }

    .stake-field input:focus {
      border-color: #278c77;
      outline: 3px solid rgb(71 211 177 / 25%);
    }

    .stake-message {
      min-height: 1rem;
      margin: 0;
      color: #b42318;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .outcomes {
      width: 100%;
      border-collapse: collapse;
    }

    .outcomes th,
    .outcomes td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e6ebf0;
      text-align: left;
    }

    .outcomes tr:last-child th,
    .outcomes tr:last-child td {
      border-bottom: 0;
    }

    .outcomes th {
      color: #24364c;
      font-size: 0.95rem;
      font-weight: 650;
    }

    .outcome {
      --party-colour: #8693a3;
      cursor: pointer;
    }

    .outcome[data-party="labour"] {
      --party-colour: #e4003b;
    }

    .outcome[data-party="reform"] {
      --party-colour: #12b6cf;
    }

    .outcome[data-party="conservative"] {
      --party-colour: #0087DC;
    }

    .outcome:hover th,
    .outcome:hover td {
      background: #f3f6f9;
    }

    .outcome.is-selected th,
    .outcome.is-selected td {
      background: color-mix(in srgb, var(--party-colour) 12%, white);
    }

    .outcome.is-selected th {
      box-shadow: inset 4px 0 0 var(--party-colour);
    }

    .party-select {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(100%, 12rem);
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--party-colour);
      border-radius: 0.3rem;
      background: #fff;
      color: var(--party-colour);
      font: inherit;
      font-weight: 750;
      text-align: left;
      cursor: pointer;
    }

    .party-select:hover {
      background: color-mix(in srgb, var(--party-colour) 8%, white);
    }

    .outcome.is-selected .party-select {
      background: var(--party-colour);
      color: #fff;
    }

    .party-select:focus-visible {
      outline: 3px solid var(--party-colour);
      outline-offset: 4px;
    }

    .outcomes td {
      width: 7.5rem;
      color: #142338;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: right;
    }

    .fractional {
      color: #627187;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .decimal {
      display: block;
      color: #142338;
      font-size: 1.05rem;
    }

    .return {
      display: none;
      margin-top: 0.2rem;
      color: #278c77;
      font-size: 0.75rem;
      font-weight: 650;
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      .site-header {
        height: 56px;
        padding: 0 1.25rem;
      }

      .primary-nav {
        gap: 1rem;
      }

      .primary-nav a {
        font-size: 0.75rem;
      }

      main {
        width: min(100% - 1.5rem, 960px);
        min-height: calc(100vh - 56px);
        padding: 1.5rem 0;
      }

      .market-header,
      .stake-panel,
      .outcomes th,
      .outcomes td {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/326/" aria-label="326 home">326</a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="/326/">Home</a>
    </nav>
  </header>
  <main>
    <section class="market" aria-labelledby="market-title">
      <header class="market-header">
        <p>Politics</p>
        <h1 id="market-title">Next United Kingdom General Election: Most Seats</h1>
      </header>
      <div class="stake-panel">
        <div class="stake-field">
          <label for="stake">Your stake</label>
          <div class="stake-input-wrap">
            <span aria-hidden="true">£</span>
            <input id="stake" type="number" min="5" step="1" inputmode="numeric" placeholder="5" aria-describedby="stake-message">
          </div>
          <p id="stake-message" class="stake-message" aria-live="polite"></p>
        </div>
      </div>
      <table class="outcomes">
        <tbody>
          <tr class="outcome" data-party="labour" data-decimal="2.75">
            <th scope="row"><button class="party-select" type="button" aria-pressed="false">LABOUR</button></th>
            <td><span class="fractional">7/4</span><span class="decimal">2.75</span><span class="return" aria-live="polite"></span></td>
          </tr>
          <tr class="outcome" data-party="reform" data-decimal="3">
            <th scope="row"><button class="party-select" type="button" aria-pressed="false">REFORM</button></th>
            <td><span class="fractional">2/1</span><span class="decimal">3.00</span><span class="return" aria-live="polite"></span></td>
          </tr>
          <tr class="outcome" data-party="conservative" data-decimal="7.333333333333333">
            <th scope="row"><button class="party-select" type="button" aria-pressed="false">CONSERVATIVE</button></th>
            <td><span class="fractional">19/3</span><span class="decimal">7.33</span><span class="return" aria-live="polite"></span></td>
          </tr>
          <tr class="outcome" data-party="other" data-decimal="6">
            <th scope="row"><button class="party-select" type="button" aria-pressed="false">ANY OTHER</button></th>
            <td><span class="fractional">5/1</span><span class="decimal">6.00</span><span class="return" aria-live="polite"></span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script>
    const stakeInput = document.getElementById("stake");
    const stakeMessage = document.getElementById("stake-message");
    const outcomes = [...document.querySelectorAll(".outcome")];
    let decimalPointAttempted = false;
    const formatter = new Intl.NumberFormat("en-GB", {
      style: "currency",
      currency: "GBP"
    });

    function updateReturns() {
      const stake = Number(stakeInput.value);
      const hasStake = stakeInput.value !== "";
      const isValidStake = Number.isInteger(stake) && stake >= 5;
      if (isValidStake) decimalPointAttempted = false;
      stakeMessage.textContent = decimalPointAttempted || (hasStake && !isValidStake)
        ? "Minimum stake £5. Whole pounds only."
        : "";
      outcomes.forEach(outcome => {
        const returnLabel = outcome.querySelector(".return");
        if (!outcome.classList.contains("is-selected") || !isValidStake) {
          returnLabel.textContent = "";
          returnLabel.style.display = "none";
          return;
        }

        const potentialReturn = stake * Number(outcome.dataset.decimal);
        const profit = potentialReturn - stake;
        returnLabel.textContent =
          "Winnings " + formatter.format(profit) +
          " · Return " + formatter.format(potentialReturn);
        returnLabel.style.display = "block";
      });
    }

    stakeInput.addEventListener("input", updateReturns);
    stakeInput.addEventListener("keydown", event => {
      if (event.key === ".") {
        decimalPointAttempted = true;
        stakeMessage.textContent = "Minimum stake £5. Whole pounds only.";
      }
    });
    outcomes.forEach(outcome => {
      outcome.querySelector(".party-select").addEventListener("click", () => {
        outcomes.forEach(candidate => {
          const isSelected = candidate === outcome;
          candidate.classList.toggle("is-selected", isSelected);
          candidate.querySelector(".party-select").setAttribute("aria-pressed", String(isSelected));
        });
        updateReturns();
      });
    });
  </script>
</body>
</html>
