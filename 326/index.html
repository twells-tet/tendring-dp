<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>326</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #142338;
      background: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
    }

    .site-header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 2.25rem;
      padding: 0 2rem;
      border-bottom: 1px solid #273b55;
      background: #142338;
      color: #fff;
    }

    .wordmark {
      color: inherit;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.06em;
      text-decoration: none;
    }

    .wordmark::first-letter {
      color: #47d3b1;
    }

    .primary-nav {
      display: flex;
      align-self: stretch;
      align-items: center;
      gap: 1.75rem;
      margin-left: auto;
    }

    .primary-nav a {
      display: flex;
      align-items: center;
      height: 100%;
      border-bottom: 3px solid transparent;
      color: #c8d1dc;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
    }

    .primary-nav a:hover,
    .primary-nav a:focus-visible {
      border-bottom-color: #47d3b1;
      color: #fff;
      outline: none;
    }

    main {
      width: min(100% - 2rem, 960px);
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      padding: 3rem 0;
    }

    .market {
      overflow: hidden;
      border: 1px solid #dbe2ea;
      border-radius: 0.5rem;
      background: #fff;
      box-shadow: 0 1px 2px rgb(20 35 56 / 4%);
    }

    .market-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e6ebf0;
    }

    .market-header p {
      margin: 0 0 0.35rem;
      color: #627187;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .market-header h1 {
      margin: 0;
      color: #142338;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .outcomes {
      width: 100%;
      border-collapse: collapse;
    }

    .outcomes th,
    .outcomes td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e6ebf0;
      text-align: left;
    }

    .outcomes tr:last-child th,
    .outcomes tr:last-child td {
      border-bottom: 0;
    }

    .outcomes th {
      color: #24364c;
      font-size: 0.95rem;
      font-weight: 650;
    }

    .outcomes td {
      width: 7.5rem;
      color: #142338;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: right;
    }

    .fractional {
      color: #627187;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .decimal {
      display: block;
      color: #142338;
      font-size: 1.05rem;
    }

    @media (max-width: 560px) {
      .site-header {
        height: 56px;
        padding: 0 1.25rem;
      }

      .primary-nav {
        gap: 1rem;
      }

      .primary-nav a {
        font-size: 0.75rem;
      }

      main {
        width: min(100% - 1.5rem, 960px);
        min-height: calc(100vh - 56px);
        padding: 1.5rem 0;
      }

      .market-header,
      .outcomes th,
      .outcomes td {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/326/" aria-label="326 home">326</a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="/326/">Home</a>
    </nav>
  </header>
  <main>
    <section class="market" aria-labelledby="market-title">
      <header class="market-header">
        <p>Politics</p>
        <h1 id="market-title">Next United Kingdom General Election: Most Seats</h1>
      </header>
      <table class="outcomes">
        <tbody>
          <tr>
            <th scope="row">Labour</th>
            <td><span class="fractional">7/4</span><span class="decimal">2.75</span></td>
          </tr>
          <tr>
            <th scope="row">Reform</th>
            <td><span class="fractional">2/1</span><span class="decimal">3.00</span></td>
          </tr>
          <tr>
            <th scope="row">Conservative</th>
            <td><span class="fractional">10/1</span><span class="decimal">11.00</span></td>
          </tr>
          <tr>
            <th scope="row">Any Other</th>
            <td><span class="fractional">50/1</span><span class="decimal">51.00</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
